<svg width="160" height="160" viewBox="0 0 160 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lgBg" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="lgQuill" x1="40" y1="40" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="lgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="8" y="8" width="144" height="144" rx="34" fill="url(#lgBg)"/>
  <rect x="8" y="8" width="144" height="144" rx="34" fill="black" fill-opacity="0.06"/>
  <!-- knowledge-graph nodes + edges -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="2">
    <line x1="48" y1="52" x2="86" y2="44"/>
    <line x1="86" y1="44" x2="116" y2="70"/>
    <line x1="48" y1="52" x2="60" y2="96"/>
    <line x1="60" y1="96" x2="104" y2="112"/>
    <line x1="116" y1="70" x2="104" y2="112"/>
  </g>
  <g fill="#ffffff" filter="url(#lgGlow)">
    <circle cx="48" cy="52" r="7"/>
    <circle cx="86" cy="44" r="5.5"/>
    <circle cx="116" cy="70" r="6.5"/>
    <circle cx="60" cy="96" r="5"/>
    <circle cx="104" cy="112" r="7.5"/>
  </g>
  <!-- quill nib -->
  <path d="M118 40 C92 50 72 74 64 104 L78 104 C86 80 100 60 122 50 Z"
        fill="url(#lgQuill)" fill-opacity="0.92"/>
  <path d="M64 104 L58 118 L72 112 Z" fill="#ffffff"/>
</svg>
