      href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <style>
      html, body, #root { height: 100%; margin: 0; background: #0b1120; }
      /* 登录页背景 — 墨问登录页.png + 暗化渐变 + 中央 vignette */
      #app-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Serif SC", serif;
        z-index: 9999; transition: opacity 0.4s ease;
        background:
          radial-gradient(ellipse at center, transparent 0%, rgba(11, 17, 32, 0.55) 70%, rgba(11, 17, 32, 0.85) 100%),
          url('/decor/login-bg.png') center center / cover no-repeat,
          radial-gradient(1200px 600px at 50% 0%, #1e1b4b 0%, #0b1120 60%);
        background-blend-mode: normal, normal, normal;
      }
      #app-splash::after {
        content: ""; position: absolute; inset: 0; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(11,17,32,0.25) 0%, rgba(11,17,32,0.10) 50%, rgba(11,17,32,0.55) 100%);
      }
      #app-splash > * { position: relative; z-index: 1; }
      #app-splash img { width: 84px; height: 84px; filter: drop-shadow(0 8px 24px rgba(139,92,246,0.45)); animation: floaty 3s ease-in-out infinite; }
      #app-splash .t { color: #f5f0ff; font-size: 20px; font-weight: 600; letter-spacing: 0.08em; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
      #app-splash .s { color: rgba(245, 240, 255, 0.82); font-size: 13px; letter-spacing: 0.06em; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
      #app-splash .bar { width: 160px; height: 3px; border-radius: 3px; overflow: hidden; background: rgba(245,240,255,0.22); }
      #app-splash .bar i { display: block; height: 100%; width: 40%; border-radius: 3px;
        background: linear-gradient(90deg, #a78bfa, #ec4899); animation: slide 1.1s ease-in-out infinite; }
      @keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- 启动闪屏（首屏渲染后由 main.tsx 淡出移除） -->
    <div id="app-splash">
      <img src="/logo.svg" alt="墨问" />
      <div class="t">墨问 · Novel AI Editor</div>
      <div class="s">正在唤醒创作引擎…</div>
      <div class="bar"><i></i></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
