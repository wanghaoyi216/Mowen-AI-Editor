server {
  listen 80;
  server_name _;

  # 根目录是上一步 Vite 构建产物
  root /usr/share/nginx/html;
  index index.html;

  # 启用 gzip：字体/JS/CSS 体积显著下降
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/xml image/svg+xml font/woff font/woff2;
  gzip_vary on;

  # 长缓存：hash 化的静态资源（CSS/JS）直接一年强缓存
  location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # ── API 反向代理到后端容器 ────────────────────────────────────
  #   compose 中后端服务名是 api，所以 http://api:8000
  #   前端调用 /api/v1/...  →  后端 /api/v1/...
  location /api/ {
    proxy_pass         http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # SSE / 长请求支持
    proxy_set_header   Connection        "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # 健康检查
  location /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }

  # SPA fallback：其他所有路径返回 index.html，由 React Router 处理
  location / {
    try_files $uri $uri/ /index.html;
    # HTML 文件不要强缓存，每次都会更新
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
  }
}
